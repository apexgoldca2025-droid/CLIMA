<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Visor Climático en Tiempo Real - Venezuela</title>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(18, 26, 43, 0.95);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: rgba(11, 15, 25, 0.98);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .brand { display: flex; align-items: center; gap: 0.5rem; }
    .brand i { font-size: 1.25rem; color: var(--accent-cyan); }
    .brand h1 { font-size: 0.95rem; font-weight: 700; line-height: 1.2; }
    .brand span { color: var(--accent-cyan); display: block; font-size: 0.75rem; }

    .header-status { display: flex; flex-direction: column; align-items: flex-end; font-size: 0.75rem; gap: 0.2rem; }

    .live-badge {
      display: flex; align-items: center; gap: 0.3rem;
      background: rgba(16, 185, 129, 0.15); color: #10b981;
      padding: 0.2rem 0.5rem; border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600; font-size: 0.7rem;
    }

    .pulse {
      width: 6px; height: 6px; background-color: #10b981; border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse-animation 1.5s infinite;
    }

    @keyframes pulse-animation {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .container {
      max-width: 1200px; margin: 0 auto; padding: 0.75rem;
      width: 100%; flex: 1; display: flex; flex-direction: column; gap: 0.75rem;
    }

    .control-bar {
      display: flex; flex-direction: column; gap: 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border-color);
      padding: 0.75rem; border-radius: 10px;
    }

    .city-selector {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }

    .city-selector label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

    .city-selector select {
      flex: 1; background: #1e293b; color: var(--text-main);
      border: 1px solid var(--border-color); padding: 0.5rem;
      border-radius: 8px; font-size: 0.9rem; outline: none;
    }

    .btn-sync {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      color: white; border: none; padding: 0.6rem; width: 100%;
      border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }

    .visor-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    }

    .visor-header {
      padding: 0.75rem; border-bottom: 1px solid var(--border-color);
      display: flex; flex-direction: column; gap: 0.5rem;
    }

    .visor-header h3 { font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem; }

    .layer-buttons { display: flex; gap: 0.35rem; width: 100%; }

    .layer-btn {
      flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 0.4rem 0.2rem; border-radius: 6px;
      font-size: 0.7rem; text-align: center; cursor: pointer; font-weight: 500;
    }

    .layer-btn.active, .layer-btn:hover {
      background: var(--accent-blue); color: white; border-color: var(--accent-blue);
    }

    /* CONTENEDOR CON RECORTE PARA OCULTAR LA BARRA BLANCA INFERIOR */
    .map-frame-wrapper {
      width: 100%;
      height: 320px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .map-frame-wrapper iframe {
      width: 100%;
      height: 440px; /* Se expande para empujar la barra fuera del visor visible */
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    .weather-panel { display: flex; flex-direction: column; gap: 0.75rem; }

    .current-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 1rem;
    }

    .current-card h4 { font-size: 0.9rem; color: var(--text-muted); }

    .current-temp-box {
      display: flex; align-items: center; justify-content: space-between; margin: 0.5rem 0;
    }

    .temp-val { font-size: 2.5rem; font-weight: 700; color: #fff; }
    .weather-icon-large { font-size: 2.5rem; color: var(--accent-gold); }

    .weather-metrics {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.75rem;
    }

    .metric-item {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.6rem; border-radius: 8px;
    }

    .metric-item span { display: block; font-size: 0.7rem; color: var(--text-muted); }
    .metric-item strong { font-size: 0.9rem; color: var(--text-main); }

    .hourly-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 1rem;
    }

    .hourly-card h4 { font-size: 0.9rem; margin-bottom: 0.5rem; }

    .hourly-list {
      display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem;
      scrollbar-width: thin;
    }

    .hourly-item {
      flex: 0 0 auto; text-align: center; background: rgba(255, 255, 255, 0.03);
      padding: 0.5rem 0.75rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05);
      min-width: 70px;
    }

    .hourly-item .time { font-size: 0.75rem; color: var(--text-muted); }
    .hourly-item .rain { font-size: 0.7rem; color: var(--accent-cyan); margin: 0.2rem 0; }
    .hourly-item .temp { font-size: 0.9rem; font-weight: 600; }

    footer {
      border-top: 1px solid var(--border-color); padding: 1rem;
      text-align: center; font-size: 0.75rem; color: var(--text-muted);
      margin-top: auto; background: rgba(11, 15, 25, 0.98);
    }
    footer strong { color: var(--text-main); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-earth-americas"></i>
      <div>
        <h1>Visor Climático</h1>
        <span>Venezuela & NASA</span>
      </div>
    </div>
    <div class="header-status">
      <div class="live-badge">
        <div class="pulse"></div> EN VIVO
      </div>
      <div><i class="fa-regular fa-clock"></i> <span id="utc-clock">00:00:00</span> UTC</div>
    </div>
  </header>

  <div class="container">
    
    <div class="control-bar">
      <div class="city-selector">
        <label for="select-city"><i class="fa-solid fa-location-dot"></i> Región:</label>
        <select id="select-city" onchange="changeCity()">
          <option value="maracay" data-lat="10.2469" data-lon="-67.5958" selected>Maracay</option>
          <option value="caracas" data-lat="10.4806" data-lon="-66.9036">Caracas</option>
          <option value="valencia" data-lat="10.1620" data-lon="-68.0077">Valencia</option>
          <option value="maracaibo" data-lat="10.6427" data-lon="-71.6125">Maracaibo</option>
          <option value="barquisimeto" data-lat="10.0647" data-lon="-69.3570">Barquisimeto</option>
          <option value="puerto_ordaz" data-lat="8.2978" data-lon="-62.7115">Puerto Ordaz / Guayana</option>
          <option value="barinas" data-lat="8.6226" data-lon="-70.2075">Barinas</option>
        </select>
      </div>
      <button class="btn-sync" onclick="fetchWeatherData()">
        <i class="fa-solid fa-rotate"></i> Sincronizar Datos en Vivo
      </button>
    </div>

    <div class="weather-panel">
      
      <div class="visor-card">
        <div class="visor-header">
          <h3><i class="fa-solid fa-satellite-dish"></i> Radar Satelital & Nubes</h3>
          <div class="layer-buttons">
            <button class="layer-btn active" onclick="setWindyOverlay('rain')">Lluvia</button>
            <button class="layer-btn" onclick="setWindyOverlay('clouds')">Nubes</button>
            <button class="layer-btn" onclick="setWindyOverlay('temp')">Temp.</button>
          </div>
        </div>
        <div class="map-frame-wrapper">
          <iframe id="windy-frame" src="https://embed.windy.com/embed2.html?lat=10.2469&lon=-67.5958&detailLat=10.2469&detailLon=-67.5958&width=400&height=440&zoom=7&level=surface&overlay=rain&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"></iframe>
        </div>
      </div>

      <div class="current-card">
        <h4 id="city-title"><i class="fa-solid fa-location-dot"></i> Maracay</h4>
        <div class="current-temp-box">
          <div>
            <div class="temp-val" id="current-temp">--°C</div>
            <div style="color: var(--text-muted); font-size: 0.85rem;" id="weather-desc">Cargando...</div>
          </div>
          <i class="fa-solid fa-sun weather-icon-large" id="main-weather-icon"></i>
        </div>

        <div class="weather-metrics">
          <div class="metric-item">
            <span>Prob. Lluvia Hoy</span>
            <strong id="rain-prob">--%</strong>
          </div>
          <div class="metric-item">
            <span>Humedad</span>
            <strong id="humidity">--%</strong>
          </div>
          <div class="metric-item">
            <span>Viento</span>
            <strong id="wind-speed">-- km/h</strong>
          </div>
          <div class="metric-item">
            <span>Radiación UV</span>
            <strong id="uv-index">--</strong>
          </div>
        </div>
      </div>

      <div class="hourly-card">
        <h4><i class="fa-regular fa-clock"></i> Pronóstico Próximas Horas</h4>
        <div class="hourly-list" id="hourly-container"></div>
      </div>

    </div>
  </div>

  <footer>
    <p>Desarrollado por <strong>Alfredo Belandria</strong></p>
    <p style="margin-top: 0.2rem; font-size: 0.7rem;">Sincronizado en tiempo real con estaciones y satélite</p>
  </footer>

  <script>
    let currentLat = 10.2469;
    let currentLon = -67.5958;
    let currentOverlay = 'rain';

    function updateWindyIframe() {
      const iframe = document.getElementById('windy-frame');
      iframe.src = `https://embed.windy.com/embed2.html?lat=${currentLat}&lon=${currentLon}&detailLat=${currentLat}&detailLon=${currentLon}&width=400&height=440&zoom=7&level=surface&overlay=${currentOverlay}&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1`;
    }

    function setWindyOverlay(overlay) {
      currentOverlay = overlay;
      document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      updateWindyIframe();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('utc-clock').textContent = now.toUTCString().split(' ')[4];
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchWeatherData() {
      const select = document.getElementById('select-city');
      const selectedOption = select.options[select.selectedIndex];
      currentLat = parseFloat(selectedOption.getAttribute('data-lat'));
      currentLon = parseFloat(selectedOption.getAttribute('data-lon'));
      const cityName = selectedOption.text;

      document.getElementById('city-title').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${cityName}`;
      updateWindyIframe();

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current_weather=true&hourly=temperature_2m,precipitation_probability,relativehumidity_2m,weathercode&daily=precipitation_probability_max,uv_index_max&timezone=auto`;
        const response = await fetch(url);
        const data = await response.json();

        const current = data.current_weather;
        document.getElementById('current-temp').textContent = `${Math.round(current.temperature)}°C`;
        document.getElementById('wind-speed').textContent = `${current.windspeed} km/h`;
        document.getElementById('rain-prob').textContent = `${data.daily.precipitation_probability_max[0]}%`;
        document.getElementById('uv-index').textContent = data.daily.uv_index_max[0];
        
        const currentHour = new Date().getHours();
        const humidityVal = data.hourly.relativehumidity_2m[currentHour] || 75;
        document.getElementById('humidity').textContent = `${humidityVal}%`;

        const weatherInfo = parseWeatherCode(current.weathercode);
        document.getElementById('weather-desc').textContent = weatherInfo.text;
        document.getElementById('main-weather-icon').className = `fa-solid ${weatherInfo.icon} weather-icon-large`;

        const hourlyContainer = document.getElementById('hourly-container');
        hourlyContainer.innerHTML = '';
        
        for (let i = currentHour; i < currentHour + 8; i++) {
          if (!data.hourly.time[i]) break;
          const timeStr = data.hourly.time[i].split('T')[1];
          const temp = Math.round(data.hourly.temperature_2m[i]);
          const rainProb = data.hourly.precipitation_probability[i];

          const item = document.createElement('div');
          item.className = 'hourly-item';
          item.innerHTML = `
            <div class="time">${timeStr}</div>
            <div class="rain"><i class="fa-solid fa-droplet"></i> ${rainProb}%</div>
            <div class="temp">${temp}°C</div>
          `;
          hourlyContainer.appendChild(item);
        }

      } catch (error) {
        console.error("Error meteorológico:", error);
      }
    }

    function parseWeatherCode(code) {
      if (code === 0) return { text: "Despejado / Soleado", icon: "fa-sun" };
      if (code >= 1 && code <= 3) return { text: "Parcialmente Nublado", icon: "fa-cloud-sun" };
      if (code >= 45 && code <= 48) return { text: "Neblina", icon: "fa-smog" };
      if (code >= 51 && code <= 67) return { text: "Llovizna / Lluvia ligera", icon: "fa-cloud-rain" };
      if (code >= 80 && code <= 99) return { text: "Tormenta / Lluvia Fuerte", icon: "fa-cloud-showers-heavy" };
      return { text: "Nublado", icon: "fa-cloud" };
    }

    function changeCity() {
      fetchWeatherData();
    }

    fetchWeatherData();
  </script>
</body>
</html>
